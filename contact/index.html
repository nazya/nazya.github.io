<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Contact · Nazarii Tupitsa</title>
    <meta name="description" content="Contact QR code for Nazarii Tupitsa." />
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body id="top">
    <a class="to-top-hit" href="#top" aria-label="Back to top" title="Back to top"></a>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="../">Home</a>
        <div class="header-right">
          <nav class="nav" aria-label="Primary">
            <a href="../papers/">Papers</a>
            <!-- <a href="../blog/">Blog</a> -->
            <a href="../ErgoType/">ErgoType</a>
          </nav>
          <button class="theme-toggle" type="button" data-theme-toggle="true" aria-pressed="false" aria-label="Toggle theme" title="Toggle theme">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap page-content contact-page">
      <h1>Nazarii Tupitsa</h1>
      <div class="qr-list">
        <div class="qr-block">
          <div class="qr-code contact-qr" role="img" aria-label="QR code with Nazarii Tupitsa contact details"></div>
          <button class="copy-text" type="button" data-copy="nazarii.tupitsa@gmail.com" aria-label="Copy email">
            <span>nazarii.tupitsa@gmail.com</span>
            <span class="copy-icon" aria-hidden="true"></span>
          </button>
        </div>
        <div class="qr-block">
          <div class="qr-code linkedin-qr" role="img" aria-label="QR code linking to Nazarii Tupitsa LinkedIn profile"></div>
          <button class="copy-text" type="button" data-copy="https://www.linkedin.com/in/nazarii-tupitsa/" aria-label="Copy LinkedIn URL">
            <span>linkedin.com/in/nazarii-tupitsa</span>
            <span class="copy-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span>© <span id="year"></span> Nazarii Tupitsa · <a class="footer-link" href="../credits/">Credits</a></span>
      </div>
    </footer>
    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear());
    </script>
    <script src="../scripts/totop.js"></script>
    <script src="../scripts/layout.js"></script>
    <script src="../scripts/copy.js"></script>
    <script src="../scripts/theme.js"></script>
  </body>
</html>
